<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Picker 测试页面</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f0f23, #1a1a3e);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 40px;
        }
        .container { max-width: 900px; margin: 0 auto; }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }
        .subtitle {
            color: #888;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(99,102,241,0.15);
            border-color: rgba(99,102,241,0.3);
        }
        .card h3 {
            font-size: 1.2rem;
            color: #a78bfa;
            margin-bottom: 10px;
        }
        .card p {
            color: #9ca3af;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #facc15, #eab308);
            color: #1a1a2e;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(250,204,21,0.4); }
        .btn-secondary {
            background: transparent;
            border: 1px solid #6366f1;
            color: #6366f1;
        }
        .btn-secondary:hover { background: rgba(99,102,241,0.1); }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #f97316);
            color: white;
        }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(239,68,68,0.4); }

        .hero-image {
            width: 100%;
            height: 220px;
            border-radius: 16px;
            background: linear-gradient(135deg, #1e1b4b, #312e81, #4338ca);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin-bottom: 40px;
        }

        .stats {
            display: flex;
            gap: 30px;
            margin-bottom: 40px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-label {
            color: #6b7280;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .nav-bar {
            display: flex;
            gap: 24px;
            padding: 16px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 40px;
        }
        .nav-bar a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 15px;
            transition: color 0.2s;
        }
        .nav-bar a:hover { color: #6366f1; }
        .nav-bar a.active { color: #6366f1; font-weight: 600; }

        footer {
            text-align: center;
            padding: 30px 0;
            color: #4b5563;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav-bar">
            <a href="#" class="active">首页</a>
            <a href="#">产品</a>
            <a href="#">关于我们</a>
            <a href="#">联系方式</a>
        </nav>

        <h1>Web Element Picker 测试页面</h1>
        <p class="subtitle">点击右下角 🎯 按钮，然后选择你想修改的元素</p>

        <div class="hero-image">🚀 Hero Banner</div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value">128</div>
                <div class="stat-label">活跃用户</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">3.2K</div>
                <div class="stat-label">修改次数</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">99%</div>
                <div class="stat-label">满意度</div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary">主要按钮</button>
            <button class="btn btn-secondary">次要按钮</button>
            <button class="btn btn-danger">警告按钮</button>
        </div>

        <div class="card-grid">
            <div class="card">
                <h3>🎨 视觉设计</h3>
                <p>选择任意元素，描述你想要的样式修改。支持颜色、字体、布局等各种CSS属性的修改。</p>
            </div>
            <div class="card">
                <h3>📝 内容修改</h3>
                <p>想要修改文案？选中文本元素，输入新的内容描述，AI 会帮你生成修改后的代码。</p>
            </div>
            <div class="card">
                <h3>🖼️ 参考图片</h3>
                <p>如果你有参考设计图，可以在修改对话框中上传图片，AI 会参考图片来生成代码。</p>
            </div>
        </div>

        <footer>
            <p>Web Element Picker &copy; 2024 — 由 Antigravity 驱动</p>
        </footer>
    </div>
</body>
</html>
